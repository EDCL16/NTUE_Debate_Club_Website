<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>聯絡我們｜北教大辯論社</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <img src="image/NUTE_Debate_Icon.jpg" alt="社徽" class="brand-icon" />
          <span class="brand-text"
            >臺北教育大學辯論社<small>NTUE DEBATE CLUB</small></span
          >
        </a>
        <nav>
          <ul class="site-nav">
            <li><a href="index.html">首頁</a></li>
            <li><a href="members.html">成員</a></li>
            <li><a href="activities.html">活動</a></li>
            <li><a href="results.html">成績</a></li>
            <li><a href="contact.html" aria-current="page">聯絡我們</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="wrap">
      <h1>聯絡我們</h1>
      <p>對辯論有興趣、參與課程、邀請打練習賽，都歡迎跟我們聯絡。</p>

      <div class="contact-grid" style="margin-top: 2rem">
        <div class="contact-block reveal">
          <dl>
            <dt>電子郵件</dt>
            <dd>
              <a href="mailto:ntue.debate@example.com"
                >ntue.debate@example.com</a
              >
            </dd>

            <dt>社課時間</dt>
            <dd>每週一 19:00 ~ 21:00</dd>

            <dt>地點</dt>
            <dd>臺北教育大學 學生活動中心 305 教室</dd>
          </dl>

          <div class="social-links">
            <a
              href="https://www.instagram.com/ntue_debate/"
              target="_blank"
              rel="noopener"
              aria-label="Instagram"
              title="Instagram"
            >
              <img src="image/social_media/ig.jpg" alt="Instagram" />
            </a>
            <a
              href="https://www.facebook.com/ntue.debate"
              target="_blank"
              rel="noopener"
              aria-label="Facebook"
              title="Facebook"
            >
              <img src="image/social_media/fb.jpg" alt="Facebook" />
            </a>
          </div>
        </div>

        <div class="contact-block reveal">
          <h3 style="margin-top: 0">想加入我們？</h3>
          <p>無須任何辯論經驗，只要願意練習表達與思考，隨時歡迎來參與課程。</p>
          <a class="cta" href="mailto:ntue.debate@example.com">寄信詢問</a>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p>
        &copy; 2026 臺北教育大學辯論社 NTUE Debate Club ・
        <a href="contact.html">聯絡我們</a>
      </p>
    </footer>

    <script src="js/main.js" defer></script>
  </body>
</html>
